[project]
name = "llm-tracer"
version = "0.1.0"
description = "Lightweight LLM observability proxy for local Ollama"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "fastapi",
    "httpx",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
